name: Dorm check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: dorm-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests
      - run: playwright install --with-deps chromium
      - run: python dorm_check.py
        env:
          VDU_USERNAME: ${{ secrets.VDU_USERNAME }}
          VDU_PASSWORD: ${{ secrets.VDU_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}