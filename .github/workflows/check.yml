
name: Dorm check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run dorm check
        env:
          VDU_USERNAME: ${{ secrets.VDU_USERNAME }}
          VDU_PASSWORD: ${{ secrets.VDU_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REGION_EXCLUDE: viln
        run: python dorm_check.py
