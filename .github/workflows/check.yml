
name: VMU Dorm Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vmu-dorm-check
  cancel-in-progress: false

jobs:
  check-dorm:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Check dorm vacancies
        env:
          VDU_USERNAME: ${{ secrets.VDU_USERNAME }}
          VDU_PASSWORD: ${{ secrets.VDU_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u dorm_check.py
